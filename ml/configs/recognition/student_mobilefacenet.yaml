# MobileFaceNet student, arm A0 of KEHOACH 3.7. The KD arm inherits this file
# and switches teacher and distill on, so only the losses differ.

run:
  task: recognition
  seed: 42
  deterministic: true
  tags: [student, mobilefacenet, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: mobilefacenet
  # The frame MS1MV3 aligns to, and it fixes the closing kernel at 7.
  input_hw: [112, 112]
  params:
    embedding: 512
    width: 64

data:
  name: ms1mv3
  # 400 MB clear of the paging cliff at 192 (measurements 2).
  batch_size: 128
  # Readers are not the constraint on this branch (measurements 2).
  num_workers: 6
  prefetch_factor: 4
  split_files:
    - data/splits/recognition/v1_identity_disjoint/train_ids.txt
    - data/splits/recognition/v1_identity_disjoint/val_ids.txt
  params:
    shards: data/interim/recognition/ms1mv3_shards
    benchmarks: data/raw/recognition/benchmarks
    embedding_dim: 512
    arcface:
      scale: 64.0
      margin: 0.5

train:
  # Budget for two arms on one card, not what the method wants (measurements 2).
  epochs: 10
  amp: true
  # Horizon of ten thousand steps, a quarter of an epoch at this batch size.
  ema_decay: 0.9999
  grad_clip_norm: 5.0
  val_every_epochs: 1
  # Memory more than speed, and both arms resolve it alike (measurements 2).
  compile: true
  channels_last: true

optim:
  name: sgd
  # Linear scaling from arcface_torch's ms1mv3_mbf (measurements 2).
  lr: 0.0125
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: false

sched:
  name: cosine
  warmup_epochs: 1
  min_lr: 0.0000125

teacher:
  enabled: false

distill:
  enabled: false
