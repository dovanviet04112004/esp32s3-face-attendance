# MobileFaceNet student, arm A0 of the ablation in KEHOACH section 3.7: random
# init, ArcFace on the real labels, no teacher. The KD arm inherits this file and
# switches the teacher and distill sections on, so both arms share one
# architecture and one schedule and only the losses differ.

run:
  task: recognition
  seed: 42
  deterministic: true
  tags: [student, mobilefacenet, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: mobilefacenet
  # 112 square is the frame MS1MV3 was aligned into and the one postproc/align.py
  # reproduces. It also fixes the closing depthwise kernel at 7, which is the map
  # this size leaves.
  input_hw: [112, 112]
  params:
    embedding: 512
    width: 64

data:
  name: ms1mv3
  # Measured on the 4 GB card at 84,088 classes, compiled and channels-last: 856
  # images a second at 2.72 GiB here, 886 at 3.13 with 160, and 578 at 3.50 with
  # 192. The last one is the cliff - WSL pages to host memory rather than raising,
  # so going over shows up as a slow epoch and nothing else. 160 buys 3 percent
  # and sits 400 MB from that cliff, which a long run's fragmentation can cover.
  batch_size: 128
  # The loader reaches 5,568 images a second on four readers and 9,189 on eight,
  # against the 856 the step consumes, so readers are not the constraint here and
  # six is chosen to leave cores and memory for everything else.
  num_workers: 6
  prefetch_factor: 4
  split_files:
    - data/splits/recognition/v1_identity_disjoint/train_ids.txt
    - data/splits/recognition/v1_identity_disjoint/val_ids.txt
  params:
    shards: data/interim/recognition/ms1mv3_shards
    benchmarks: data/raw/recognition/benchmarks
    embedding_dim: 512
    arcface:
      scale: 64.0
      margin: 0.5

train:
  # Measured: 856 images a second, so 4.66M records is 1.5 hours an epoch. Ten is
  # what fits the budget for two arms on one card, not what the method wants -
  # arcface_torch trains mbf for forty. The report has to say so rather than
  # present the result as a reproduction.
  epochs: 10
  amp: true
  # Horizon of ten thousand steps, a quarter of an epoch at this batch size.
  ema_decay: 0.9999
  grad_clip_norm: 5.0
  val_every_epochs: 1
  # Measured: 736 to 856 images a second and 3.38 to 2.72 GiB peak. The memory is
  # the bigger reason - 3.38 of 4.0 leaves no room for the fragmentation a long
  # run accumulates. Both arms must resolve this the same way (KEHOACH 3.7).
  compile: true
  channels_last: true

optim:
  name: sgd
  # Linear scaling from arcface_torch's ms1mv3_mbf recipe, which uses 0.1 at a
  # total batch of 1024 across eight cards.
  lr: 0.0125
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: false

sched:
  name: cosine
  warmup_epochs: 1
  min_lr: 0.0000125

teacher:
  enabled: false

distill:
  enabled: false
