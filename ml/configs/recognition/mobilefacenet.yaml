# MobileFaceNet, 512-D embedding, trained on identity labels with an ArcFace
# margin (KEHOACH 1.1).

run:
  task: recognition
  seed: 42
  deterministic: true
  tags: [mobilefacenet]
  notes: 512-D embedding on MS1MV3

model:
  name: mobilefacenet
  # Odd at every stride-2, which is what folds PAD into the convolution, and
  # it fixes the closing kernel at 8 (KEHOACH 3 layer 1).
  input_hw: [113, 113]
  params:
    embedding: 512
    width: 64
    # esp-nn folds this into the convolution's output clamp, so it costs
    # nothing either way; relu is the one CLE still applies to (KEHOACH 3.8).
    activation: relu

data:
  name: ms1mv3
  # 400 MB clear of the paging cliff at 192 (measurements 2).
  batch_size: 128
  # Readers are not the constraint on this branch (measurements 2).
  num_workers: 6
  prefetch_factor: 4
  split_files:
    - data/splits/recognition/v1_identity_disjoint/train_ids.txt
    - data/splits/recognition/v1_identity_disjoint/val_ids.txt
  params:
    shards: data/interim/recognition/ms1mv3_shards
    benchmarks: data/raw/recognition/benchmarks
    embedding_dim: 512
    arcface:
      scale: 64.0
      margin: 0.5

train:
  # Budget for one card, not what the method wants (measurements 2).
  epochs: 10
  amp: true
  # Horizon of ten thousand steps, a quarter of an epoch at this batch size.
  ema_decay: 0.9999
  grad_clip_norm: 5.0
  val_every_epochs: 1
  # Memory more than speed (measurements 2).
  compile: true
  channels_last: true

optim:
  name: sgd
  # Linear scaling from arcface_torch's ms1mv3_mbf (measurements 2).
  lr: 0.0125
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: false

sched:
  name: cosine
  warmup_epochs: 1
  min_lr: 0.0000125
