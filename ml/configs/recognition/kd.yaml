# Arm A3 of KEHOACH 3.7. Everything the two arms must share is inherited rather
# than repeated, so the only difference is the teacher and the losses reading it.

_base_: student_mobilefacenet.yaml

run:
  tags: [student, mobilefacenet, arm_kd_full]
  notes: kd arm, embedding plus relational distillation from R50 at WebFace600K

teacher:
  enabled: true
  name: cached_embedding

data:
  params:
    # Written by export_embedding.py, addressed by the record's key.
    teacher_cache: artifacts/recognition/teacher/ms1mv3_embeddings.f16

distill:
  enabled: true
  task_loss_weight: 1.0
  losses:
    # Balanced against the task loss at initialisation (measurements 5).
    - name: recognition_kd_embedding
      weight: 10.0
    - name: recognition_kd_relation_rkd
      weight: 20.0
      params:
        distance_weight: 1.0
        angle_weight: 2.0
        beta: 0.1
