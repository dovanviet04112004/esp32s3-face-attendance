# Arm A3 of KEHOACH section 3.7: the baseline plus every distillation term this
# branch has. Everything the two arms must share - architecture, seed, split,
# augmentation, optimizer, schedule, epoch count, compile - is inherited rather
# than repeated, so the only difference between the two runs is the teacher and
# the losses that read it.

_base_: student_mobilefacenet.yaml

run:
  tags: [student, mobilefacenet, arm_kd_full]
  notes: kd arm, embedding plus relational distillation from R50 at WebFace600K

teacher:
  enabled: true
  # The teacher ran once, offline. Running it in the loop would make this arm
  # several times slower than the baseline it is compared against, and the table
  # would then be measuring patience.
  name: cached_embedding

data:
  params:
    # Written by export_embedding.py: one fp16 row per record, addressed by the
    # record's key, so a row and the face it came from cannot drift apart.
    teacher_cache: artifacts/recognition/teacher/ms1mv3_embeddings.f16

distill:
  enabled: true
  task_loss_weight: 1.0
  losses:
    # Measured at initialisation: ArcFace 46.2, the cosine term 1.0, the relational
    # term 0.047. Left at a weight of one the relational term would be a thousandth
    # of the gradient and the arm would be distilling in name only. These bring
    # both terms to roughly a quarter of the task loss once it settles near 8.
    - name: recognition_kd_embedding
      weight: 10.0
    - name: recognition_kd_relation_rkd
      weight: 20.0
      params:
        distance_weight: 1.0
        angle_weight: 2.0
        beta: 0.1
