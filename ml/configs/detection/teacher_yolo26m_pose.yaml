# Teacher fine-tune: COCO person-pose to WIDER FACE with five landmarks.
# Produces the soft targets arms A1 to A3 of KEHOACH section 3.7 distil from, so
# a teacher below the 0.80 hard-track target makes all three KD arms untrustworthy
# rather than merely weaker.

run:
  task: detection
  seed: 42
  deterministic: true
  tags: [teacher, yolo26m_pose]
  notes: fine-tune for box and five landmarks

model:
  name: yunet
  input_hw: [120, 160]

teacher:
  enabled: true
  name: yolo26_pose
  # Downloaded weight, not a run output. Gitignored like every other checkpoint.
  ckpt: artifacts/detection/teacher/yolo26m-pose.pt
  input_hw: [640, 640]
  params:
    coco: data/interim/detection/widerface_coco/train.json
    images: data/raw/detection/widerface/WIDER_train/images
    split_dir: data/splits/detection/v1
    yolo_dataset: data/interim/detection/widerface_yolo
    conf: 0.25
    iou: 0.5

data:
  name: widerface_yolo
  # Steady state at 640 square is 3.41 GiB of the card's 4.0, and reserved memory
  # keeps climbing to about 5.95 GiB over thirty epochs before WSL starts paging
  # to host memory, which costs a factor of fifty per step and raises no error.
  # Four leaves too little room for that; measure at epoch three, not epoch one.
  batch_size: 4
  # Measured: 4, 6 and 8 readers all hold 2.4 iterations a second, and each one
  # costs three processes because Ultralytics gives the val loader twice the
  # count. Four leaves the most memory to the page cache, which is what makes
  # every epoch after the first cheap (KEHOACH section 4.4.1).
  num_workers: 4
  split_files:
    - data/splits/detection/v1/train.txt
    - data/splits/detection/v1/landmark_val.txt

train:
  epochs: 100
  amp: true
