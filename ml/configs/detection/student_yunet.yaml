# YuNet student, arm A0 of the ablation in KEHOACH section 3.7: random init,
# task loss only, no teacher. The KD arms inherit this file and switch the
# teacher and distill sections on, so every arm shares one architecture and one
# schedule and only the losses differ.

run:
  task: detection
  seed: 42
  deterministic: true
  tags: [student, yunet, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: yunet
  # 4:3, the aspect the OV5640 delivers. Height 120 leaves the stride-16 and
  # stride-32 levels covering 112 and 96 rows, so the bottom strip is seen only
  # by the finest level.
  input_hw: [120, 160]
  params:
    num_classes: 1
    shared_convs: 1

data:
  name: widerface
  batch_size: 64
  # Measured: reading alone gives 258 images a second against 271 with the step
  # included, so nothing here waits on the GPU. Twenty readers and a deeper queue
  # hold a 28 second epoch end to end; the loader on its own reaches 17, and the
  # gap is the trainer competing for the same cores.
  num_workers: 20
  prefetch_factor: 4
  split_files:
    - data/splits/detection/v1/train.txt
    - data/splits/detection/v1/landmark_val.txt
  params:
    # Images and labels both shrunk to a 320 pixel long side by shrink_coco, so
    # the pair cannot drift. Decoding a 1024x768 original to produce a 160x120
    # letterbox is work thrown away, and this branch has no augmentation that
    # ever asks for more (KEHOACH section 4.4.1). Measured: 258 to 1135 images a
    # second, a 28 second epoch to 10.
    coco: data/interim/detection/widerface_small/train.json
    images: data/interim/detection/widerface_small/images

train:
  epochs: 300
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 10.0
  val_every_epochs: 5

optim:
  name: sgd
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 3
  min_lr: 0.0001

teacher:
  enabled: false

distill:
  enabled: false
