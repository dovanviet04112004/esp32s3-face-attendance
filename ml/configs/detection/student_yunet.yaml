# YuNet student, arm A0 of the ablation in KEHOACH section 3.7: random init,
# task loss only, no teacher. The KD arms inherit this file and switch the
# teacher and distill sections on, so every arm shares one architecture and one
# schedule and only the losses differ.

run:
  task: detection
  seed: 42
  deterministic: true
  tags: [student, yunet, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: yunet
  # 4:3, the aspect the OV5640 delivers. Height 120 leaves the stride-16 and
  # stride-32 levels covering 112 and 96 rows, so the bottom strip is seen only
  # by the finest level.
  input_hw: [120, 160]
  params:
    num_classes: 1
    shared_convs: 1

data:
  name: widerface
  batch_size: 64
  # Measured in a real 300 epoch run: 19 seconds an epoch, 22 on the epoch that
  # follows a validation. That is 581 images a second against the 1,111 a loader
  # benchmark reports, so what an epoch now waits on is the step and the twenty
  # worker processes forked at each epoch boundary, not the decode.
  num_workers: 20
  prefetch_factor: 4
  split_files:
    - data/splits/detection/v1/train.txt
    - data/splits/detection/v1/landmark_val.txt
  params:
    # Images and labels both shrunk to a 320 pixel long side by shrink_coco, so
    # the pair cannot drift. Decoding a 1024x768 original to produce a 160x120
    # letterbox is work thrown away (KEHOACH section 4.4.1): a 28 second epoch
    # became 19. What it costs was measured, not assumed - one checkpoint scored
    # on original and on shrunk validation images gives 0.6407/0.4342/0.1844
    # against 0.6372/0.4300/0.1823, half a percent, because both paths end at the
    # same 160x120 and only the extra resampling is lost.
    coco: data/interim/detection/widerface_small/train.json
    images: data/interim/detection/widerface_small/images

train:
  epochs: 300
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 10.0
  val_every_epochs: 5

optim:
  name: sgd
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 3
  min_lr: 0.0001

teacher:
  enabled: false

distill:
  enabled: false
