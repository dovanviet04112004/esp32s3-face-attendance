# YuNet student, arm A0 of the ablation in KEHOACH section 3.7: random init,
# task loss only, no teacher. The KD arms inherit this file and switch the
# teacher and distill sections on, so every arm shares one architecture and one
# schedule and only the losses differ.

run:
  task: detection
  seed: 42
  deterministic: true
  tags: [student, yunet, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: yunet
  # 4:3, the aspect the OV5640 delivers. Height 120 leaves the stride-16 and
  # stride-32 levels covering 112 and 96 rows, so the bottom strip is seen only
  # by the finest level.
  input_hw: [120, 160]
  params:
    num_classes: 1
    shared_convs: 1

data:
  name: widerface
  batch_size: 64
  # Measured in a real 300 epoch run: 19 seconds an epoch, 22 on the epoch that
  # follows a validation. That is 581 images a second against the 1,111 a loader
  # benchmark reports, so what an epoch now waits on is the step and the twenty
  # worker processes forked at each epoch boundary, not the decode.
  num_workers: 20
  prefetch_factor: 4
  split_files:
    - data/splits/detection/v1/train.txt
    - data/splits/detection/v1/landmark_val.txt
  params:
    # Originals, not the 320 pixel copy. crop_scale takes as little as 30 percent
    # of the frame and blows it up to 160 wide: from a 320 pixel image that is a
    # 1.67x upscale inventing pixels, from a 1024 pixel one it is still a
    # reduction (KEHOACH section 4.4.1). The shrink was right for a recipe with no
    # zoom and stops being right when there is one; it cost 19 seconds an epoch
    # against 28, and half a percent of AP.
    coco: data/interim/detection/widerface_coco/train.json
    images: data/raw/detection/widerface/WIDER_train/images
    # Measured on the training split: at this input the median face is 2.9 pixels
    # and level 2 never sees a positive prior. These pull the distribution up to a
    # median of 13.6 (KEHOACH section 3, layer 2).
    crop_scale: [0.3, 1.0]
    min_face_px: 8

train:
  epochs: 300
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 10.0
  val_every_epochs: 5

optim:
  name: sgd
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 3
  min_lr: 0.0001

teacher:
  enabled: false

distill:
  enabled: false
