# Arm A3 of KEHOACH 3.7. Everything the arms must share is inherited rather than
# repeated, so the only difference is the teacher and the losses reading it.

_base_: student_yunet.yaml

run:
  tags: [student, yunet, arm_kd_full]
  notes: kd arm, logit plus localization plus FGD from YOLO26m-pose

teacher:
  enabled: true
  # In the loop: a crop moves image, boxes and feature maps together, so nothing
  # keyed on an image name lines up (TASKS E4-T2).
  name: yolo26_pose_on_priors
  ckpt: artifacts/detection/teacher/yolo26m_pose_widerface.pt
  freeze: true
  params:
    # The student's own frame upscaled, never the original (KEHOACH 3, layer 2).
    upscale: 4
    input_hw: [120, 160]
    conf: 0.25
    iou: 0.5

distill:
  enabled: true
  task_loss_weight: 1.0
  # The three neck laterals; FGD resamples the teacher's wider levels down.
  feature_layers: [neck.lateral.0, neck.lateral.1, neck.lateral.2]
  # TODO(E4-T1): fill from the fine-tuned checkpoint, which does not exist yet.
  teacher_feature_layers: []
  losses:
    - name: detection_kd_logit
      weight: 1.0
      params:
        temperature: 3.0
    - name: detection_kd_localization
      weight: 1.0
      params:
        bbox_weight: 1.0
        kps_weight: 1.0
        score_threshold: 0.3
    - name: detection_kd_feature_fgd
      weight: 1.0
      params:
        student_channels: [64, 64, 64]
        teacher_channels: []
        image_hw: [120, 160]
