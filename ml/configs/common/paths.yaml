# Dataset roots. Never hardcode a path in code; point these at wherever the
# data actually lives, symlinking raw/ to another disk when space runs out.

# The two machine-specific values. A dataset belongs on fast_drive only when it
# fits the page cache; above that drvfs wins on bandwidth (KEHOACH 4.4.1).
cold_drive: /mnt/e/face-attendance-data
fast_drive: /data/face-attendance

data_root: data
raw_root: data/raw
interim_root: data/interim
processed_root: data/processed
splits_root: data/splits
cache_root: data/cache
artifacts_root: artifacts

detection:
  widerface: data/raw/detection/widerface
  retinaface_labels: data/raw/detection/retinaface_labels
  coco_json: data/interim/detection/widerface_coco

antispoof:
  celeba_spoof: data/raw/antispoof/celeba_spoof
  crops: data/interim/antispoof/celeba_spoof_crops
  # The crops above are cut with this checkpoint, so retraining detection means
  # rebuilding them: a shard set and the detector that framed it move together (KEHOACH 3).
  detector: artifacts/detection/runs/20260831-1616_cc931df_36fbea/ckpt/best.pth
  # Cross-domain evaluation only, never training (KEHOACH 1.2).
  xdomain:
    nuaa: data/raw/antispoof/xdomain/nuaa
    unique_live: data/raw/antispoof/xdomain/unique_live
    unique_replay: data/raw/antispoof/xdomain/unique_replay
    axon_masks: data/raw/antispoof/xdomain/axon_masks
    lcc_fasd: data/raw/antispoof/xdomain/lcc_fasd
    synthaspoof: data/raw/antispoof/xdomain/synthaspoof

recognition:
  ms1mv3: data/raw/recognition/ms1mv3
  glint360k: data/raw/recognition/glint360k
  benchmarks: data/raw/recognition/benchmarks
  shards: data/interim/recognition/ms1mv3_shards
  identities: data/interim/recognition/identities.txt

device:
  ov5640: data/raw/device/ov5640
  manifest: data/raw/device/ov5640/manifest.csv
