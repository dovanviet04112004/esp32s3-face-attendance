# MiniFASNetV2-SE, one backbone on the face crop, trained on live/spoof labels
# (KEHOACH 1.1).

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [minifasnet_v2_se]
  notes: live vs spoof on CelebA-Spoof crops

model:
  name: minifasnet_v2_se
  # Per view. Odd at every stride-2, which folds PAD into the convolution, and
  # it settles the closing kernel and every SE window (KEHOACH 3 layer 1).
  input_hw: [81, 81]
  params:
    num_classes: 2
    embedding: 128
    squeeze_excite: true
    # Base channel count; every stage is a multiple of it (KEHOACH 3 layer 1).
    width: 32
    # esp-nn folds this into the convolution's output clamp, so it costs
    # nothing either way; relu is the one CLE still applies to (KEHOACH 3.8).
    activation: relu
    # The face crop alone: a context backbone learns the room (KEHOACH 1.1).
    views: tight
    # A fourth input plane holding (max-min)/max: a convolution cannot derive it,
    # because max and min across channels are not linear (measurements 38.4).
    chroma: true
    # Off: the 6x6 head cost 0.096 AUC on the device against the same pool
    # without it, and the plan carries the table (KEHOACH 3).
    patch_supervision: false

data:
  name: celeba_spoof
  # Set by what one card holds at this crop size (measurements 13.3).
  batch_size: 96
  # Sixteen buys 2% for 312 MB more shuffle buffer (measurements 13.2).
  num_workers: 12
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    # Weighted by how much of each channel the model still gets wrong; the paired
    # set repeats because its two sides differ only by the screen (measurements 40.6).
    train_split: ["train:0:60", lcc_training,
                  synth_bonafide, synth_ipad, synth_samsung, synth_webcam, synth_print,
                  unique_live, unique_replay, unique_live, unique_replay, unique_live,
                  unique_replay, unique_live, unique_replay, unique_live, unique_replay]
    # The mirror's train and valid are one pool; test is not (measurements 1).
    # Two more domains ride along: a threshold fitted on CelebA alone throws away
    val_split: ["test:0:10", lcc_development, unique_live_val, unique_replay_val]  # real faces (measurements 40.5)
    test_split: "test:10:"
    # Re-encoding the crop: the board compresses once already, so a second pass
    # is the history the train set would otherwise lack (measurements 9).
    recompress_probability: 0.5
    quality_range: [30, 95]
    # Poisson-Gaussian noise, white balance, vignette, motion blur, backlight
    # and exposure, behind one gate (measurements 12.1).
    photometric_probability: 0.5
    # Every source record below 1.0x is an attack (measurements 12.5).
    crop_scale_range: [0.7, 1.0]
    # A gate, because this crop only ever narrows (measurements 15.1).
    crop_scale_probability: 0.15
    # Accepted on APCER, since hiding part of the face loosens the gate (KEHOACH 3).
    occlusion_probability: 0.25
    occlusion_side_range: [0.20, 0.45]
    # A 15 degree tilt cost 32 of 44 live frames their pass (KEHOACH 3).
    roll_probability: 0.35
    roll_range: [-18.0, 18.0]
    # A 2% shift of the box cost 15% of them (KEHOACH 3).
    translate_probability: 0.5
    translate_range: 0.10

train:
  # Half the parameters over a fifth more data, so the overfit knee arrives later
  epochs: 90  # than the 60 the two-backbone pool needed (measurements 28)
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Worth 20% here (measurements 13.3).
  channels_last: true
  compile: true

optim:
  name: sgd
  # Scaled linearly with the batch (measurements 13.3).
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 2
  min_lr: 0.0001

loss:
  # 128 889 attacks over 72 498 live, counted on the shards (measurements 40.6).
  live_weight: 1.776
  # Read only while patch_supervision is on, which it is not (KEHOACH 3).
  patch_weight: 1.0
  # Live sits at 0.997 in every domain measured, which leaves a threshold nowhere
  # to stand; this caps how far the easy half can be pushed (measurements 40.5).
  label_smoothing: 0.05
