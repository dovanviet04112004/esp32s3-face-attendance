# MiniFASNetV2-SE, one backbone on the face crop, trained on live/spoof labels
# (KEHOACH 1.1).

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [minifasnet_v2_se]
  notes: live vs spoof on CelebA-Spoof crops

model:
  name: minifasnet_v2_se
  # Per view. Odd at every stride-2, which folds PAD into the convolution, and
  # it settles the closing kernel and every SE window (KEHOACH 3 layer 1).
  input_hw: [81, 81]
  params:
    num_classes: 2
    embedding: 128
    squeeze_excite: true
    # Base channel count; every stage is a multiple of it (KEHOACH 3 layer 1).
    width: 32
    # esp-nn folds this into the convolution's output clamp, so it costs
    # nothing either way; relu is the one CLE still applies to (KEHOACH 3.8).
    activation: relu
    # The face crop alone: a context backbone learns the room (KEHOACH 1.1).
    views: tight

data:
  name: celeba_spoof
  # Set by what one card holds at this crop size (measurements 13.3).
  batch_size: 96
  # Sixteen buys 2% for 312 MB more shuffle buffer (measurements 13.2).
  num_workers: 12
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    # LCC-FASD training split five times over, about 9% of the pool (KEHOACH 1.2).
    train_split: [train, lcc_training, lcc_training, lcc_training, lcc_training, lcc_training]
    # The mirror's train and valid are one pool; test is not (measurements 1).
    val_split: "test:0:10"
    test_split: "test:10:"
    # Re-encoding the crop: the board compresses once already, so a second pass
    # is the history the train set would otherwise lack (measurements 9).
    recompress_probability: 0.5
    quality_range: [30, 95]
    # Poisson-Gaussian noise, white balance, vignette, motion blur, backlight
    # and exposure, behind one gate (measurements 12.1).
    photometric_probability: 0.5
    # Every source record below 1.0x is an attack (measurements 12.5).
    crop_scale_range: [0.7, 1.0]
    # A gate, because this crop only ever narrows (measurements 15.1).
    crop_scale_probability: 0.15
    # Accepted on APCER, since hiding part of the face loosens the gate (KEHOACH 3).
    occlusion_probability: 0.25
    occlusion_side_range: [0.20, 0.45]
    # A 15 degree tilt cost 32 of 44 live frames their pass (KEHOACH 3).
    roll_probability: 0.35
    roll_range: [-18.0, 18.0]
    # A 2% shift of the box cost 15% of them (KEHOACH 3).
    translate_probability: 0.5
    translate_range: 0.10

train:
  # Held constant so two runs of this branch stay comparable.
  epochs: 60
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Worth 20% here (measurements 13.3).
  channels_last: true
  compile: true

optim:
  name: sgd
  # Scaled linearly with the batch (measurements 13.3).
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 2
  min_lr: 0.0001
