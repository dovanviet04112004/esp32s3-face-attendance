# Teacher training: CDCN++ on CelebA-Spoof, supervised on pseudo depth maps.
# Arm A3 distils from whatever this produces, so its ACER gates any student
# trained against it (KEHOACH 3.7).

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [teacher, cdcnpp]
  notes: depth-supervised teacher for the anti-spoof branch

model:
  name: cdcnpp
  # The wide crop only, at the size the student's wide backbone takes, so both
  # see identical pixels during distillation.
  input_hw: [80, 80]
  params:
    theta: 0.7
    depth_size: 32
    width: 64

data:
  name: celeba_spoof
  # A bigger batch buys nothing and costs a gigabyte (measurements 13.3).
  batch_size: 96
  num_workers: 8
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    train_split: train
    # The mirror's train and valid are one pool; test is not (measurements 1).
    val_split: "test:0:10"
    test_split: "test:10:"
    supervision:
      contrast_weight: 10.0

train:
  # 11 minutes an epoch, under six hours in all (measurements 13.3).
  epochs: 30
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Every spatial convolution here is 3x3 dense (measurements 13.3).
  channels_last: true
  # An input to both arms alike, so 3.7 does not tie this to them.
  compile: true

optim:
  name: adam
  lr: 0.0001
  weight_decay: 0.00005

sched:
  name: step
  warmup_epochs: 1
  min_lr: 0.000001
  params:
    gamma: 0.5
    step_epochs: 10
