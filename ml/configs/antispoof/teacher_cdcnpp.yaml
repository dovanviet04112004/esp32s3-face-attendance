# Teacher training: CDCN++ on CelebA-Spoof, supervised on pseudo depth maps.
# Arm A3 of KEHOACH section 3.7 distils from whatever this produces, so a teacher
# that does not separate live from attack here makes the KD arm untrustworthy
# rather than merely weaker. Check ACER on the upstream valid split before
# training a student against it.

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [teacher, cdcnpp]
  notes: depth-supervised teacher for the anti-spoof branch

model:
  name: cdcnpp
  # The teacher reads the wide crop only, at the same size the student's own wide
  # backbone takes, so both see the identical pixels during distillation.
  input_hw: [80, 80]
  params:
    theta: 0.7
    depth_size: 32
    width: 64

data:
  name: celeba_spoof
  # Measured channels-last on the 4 GB card: 630 images a second at 1.03 GiB here
  # and 629 at 2.05 with 192, so a bigger batch buys nothing and costs a gigabyte.
  batch_size: 96
  num_workers: 8
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    train_split: train
    # Validation comes out of the mirror's test split. Measured: train and valid
    # are one pool at a median 72 and 76 KB, test is 471 KB (KEHOACH 1.3).
    val_split: "test:0:10"
    test_split: "test:10:"
    supervision:
      contrast_weight: 10.0

train:
  # Measured: 630 images a second, so 420k records is 11 minutes an epoch and the
  # whole run is under six hours.
  epochs: 30
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Measured: 515 images a second contiguous against 630 channels-last. Every
  # spatial convolution here is 3x3 dense, which is what cudnn's channels-last
  # kernels are for.
  channels_last: true

optim:
  name: adam
  lr: 0.0001
  weight_decay: 0.00005

sched:
  name: step
  warmup_epochs: 1
  min_lr: 0.000001
  params:
    gamma: 0.5
    step_epochs: 10
