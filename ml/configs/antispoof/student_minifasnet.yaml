# MiniFASNetV2-SE student, arm A0 of the ablation in KEHOACH section 3.7: random
# init, task loss only, no teacher. The KD arm inherits this file and switches
# the teacher and distill sections on, so both arms share one architecture and
# one schedule and only the losses differ.

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [student, minifasnet_v2_se, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: minifasnet_v2_se
  # Per view. The 5x5 depthwise layer closing each backbone consumes exactly the
  # map this size produces, so changing it without changing that kernel changes
  # what the classifier sees.
  input_hw: [80, 80]
  params:
    num_classes: 2
    embedding: 128
    squeeze_excite: true

data:
  name: celeba_spoof
  # Set by what the KD arm can hold, since both arms must share it (KEHOACH 3.7).
  # Measured channels-last on the 4 GB card, baseline against kd: 256 gives 2,617
  # images a second and the kd arm does not fit at all; 128 gives 205 for the kd
  # arm at 2.70 GiB, which is the card paging rather than computing; 96 gives
  # 1,735 and 630 at 0.72 and 2.03 GiB. The baseline alone would rather have 256.
  batch_size: 96
  # Measured on the 224 px context view: 1,687 images a second at eight readers
  # against 1,937 at twelve, with the GPU sitting at 6% either way. Sixteen buys
  # 2% more and costs another 312 MB of shuffle buffer on a machine with nine GB.
  num_workers: 12
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    train_split: train
    # Validation comes out of the mirror's test split. Measured: train and valid
    # are one pool at a median 72 and 76 KB, test is 471 KB (KEHOACH 1.3).
    val_split: "test:0:10"
    test_split: "test:10:"
    # Measured on 3k train records: every one of the 309 that crop below 1.0x is
    # an attack, so the context a frame affords predicts the label on its own.
    crop_scale_range: [0.7, 2.7]

train:
  # A step benchmark reads 1,841 images a second; a real epoch runs below any such
  # ceiling. Same count for both arms, since 3.7 reports the cost gap (measurements).
  epochs: 60
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Measured: 2,034 images a second contiguous against 2,617 channels-last, and
  # 1,545 against 1,841 once the step carries EMA and clipping (KEHOACH 3.7).
  channels_last: true
  compile: true

optim:
  name: sgd
  # Scaled linearly with the batch: 0.05 was for 256, and the KD arm's memory
  # pushed that down to 96.
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 2
  min_lr: 0.0001

teacher:
  enabled: false

distill:
  enabled: false
