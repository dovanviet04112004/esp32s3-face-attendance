# MiniFASNetV2-SE student, arm A0 of KEHOACH 3.7. The KD arm inherits this file
# and switches teacher and distill on, so only the losses differ.

run:
  task: antispoof
  seed: 42
  deterministic: true
  tags: [student, minifasnet_v2_se, arm_baseline]
  notes: baseline arm, no teacher

model:
  name: minifasnet_v2_se
  # Per view, and the 5x5 depthwise layer closing each backbone consumes exactly
  # the map this size produces.
  input_hw: [80, 80]
  params:
    num_classes: 2
    embedding: 128
    squeeze_excite: true

data:
  name: celeba_spoof
  # Set by what the KD arm can hold, since both arms share it (measurements 13.3).
  batch_size: 96
  # Sixteen buys 2% for 312 MB more shuffle buffer (measurements 13.2).
  num_workers: 12
  prefetch_factor: 4
  params:
    shards: data/interim/antispoof/celeba_spoof_crops
    train_split: train
    # The mirror's train and valid are one pool; test is not (measurements 1).
    val_split: "test:0:10"
    test_split: "test:10:"
    # Every source record below 1.0x is an attack (measurements 12.5).
    crop_scale_range: [0.7, 1.2]
    # A gate, because this crop only ever narrows (measurements 15.1).
    crop_scale_probability: 0.15
    # Accepted on APCER, since hiding part of the face loosens the gate (KEHOACH 3).
    occlusion_probability: 0.25
    occlusion_side_range: [0.20, 0.45]

train:
  # Same count for both arms, since 3.7 reports the cost gap.
  epochs: 60
  amp: true
  ema_decay: 0.999
  grad_clip_norm: 5.0
  val_every_epochs: 2
  # Worth 20% here, and both arms resolve it alike (measurements 13.3).
  channels_last: true
  compile: true

optim:
  name: sgd
  # Scaled linearly with the batch (measurements 13.3).
  lr: 0.02
  weight_decay: 0.0005
  params:
    momentum: 0.9
    nesterov: true

sched:
  name: cosine
  warmup_epochs: 2
  min_lr: 0.0001

teacher:
  enabled: false

distill:
  enabled: false
