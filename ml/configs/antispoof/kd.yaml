# Arm A3 of KEHOACH 3.7. Everything the two arms must share is inherited rather
# than repeated, so the only difference is the teacher and the losses reading it.

_base_: student_minifasnet.yaml

run:
  tags: [student, minifasnet_v2_se, arm_kd_full]
  notes: kd arm, logit plus depth map plus contrastive depth from CDCN++

teacher:
  enabled: true
  name: cdcnpp
  # A stable path keeps it clear of the resume loop, which treats every
  # directory under runs/ as somewhere a student could continue from.
  ckpt: artifacts/antispoof/teacher/cdcnpp_best.pth
  input_hw: [81, 81]
  params:
    theta: 0.7
    depth_size: 32
    width: 64

distill:
  enabled: true
  task_loss_weight: 1.0
  # The joined embedding: the classifier after it carries no spatial information.
  feature_layers: [drop]
  losses:
    - name: antispoof_kd_logit
      weight: 1.0
      params:
        temperature: 2.0
        scale: 4.0
    - name: antispoof_kd_depth_map
      weight: 1.0
      params:
        embedding: 256
        depth_size: 32
    - name: antispoof_contrastive_depth
      weight: 0.5
      params:
        embedding: 256
        depth_size: 32
