[project]
name = "facepipe"
version = "0.1.0"
description = "Training, distillation, quantization and export for the ESP32-S3 face attendance kiosk"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2",
    "huggingface-hub>=0.26",
    "numpy>=2.1",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tensorboard>=2.18",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.67",
]

[project.optional-dependencies]
export = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxsim>=0.4.36",
]
track = [
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facepipe"]

# CPU wheels only. Training happens on a machine with its own CUDA build; CI and
# the reproducibility lock must not depend on a GPU being present.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
