[project]
name = "facepipe"
version = "0.1.0"
description = "Training, distillation, quantization and export for the ESP32-S3 face attendance kiosk"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2",
    "huggingface-hub>=0.26",
    "numpy>=2.1",
    "pillow>=11.0",
    "pyarrow>=18.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tensorboard>=2.18",
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Pick exactly one build of torch. Neither is a default: an accidental CPU
# install on the training box wastes days before anyone notices the GPU idle.
cpu = [
    "torch>=2.5",
    "torchvision>=0.20",
]
cu130 = [
    "torch>=2.5",
    "torchvision>=0.20",
]
export = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxsim>=0.4.36",
]
# AGPL-3.0, and only the detection teacher needs it. Kept out of the default
# install so CI does not carry opencv and matplotlib to run unit tests.
teacher = [
    "ultralytics>=8.4",
]
# Reading the WIDER FACE scoring kit, whose ground truth ships as MATLAB v5.
eval = [
    "scipy>=1.14",
]
track = [
    "wandb>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/facepipe"]

# Training runs on CUDA; CI has no GPU. Both builds are locked so the two
# environments resolve from one uv.lock instead of drifting apart.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
