# Continuous WAL archiving. Loaded by postgres.conf include; every finished
# segment is pushed before postgres is allowed to recycle it (KEHOACH 4.8).
archive_mode = on
archive_command = '/usr/local/bin/wal-push.sh %p %f'
archive_timeout = 300

# What a slow query looks like before a user notices it (KEHOACH 9.22.5).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
log_min_duration_statement = 500
log_parameter_max_length = 1024
