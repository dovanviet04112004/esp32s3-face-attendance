# Broker config for the kiosk fleet (KEHOACH 7.4).
# node.name and node.cookie come from the environment so no secret lands here.

node {
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

# Plaintext stays bound to the container's own loopback: the dashboard and
# emqx ctl reach it, nothing on the network does.
listeners.tcp.default {
  bind = "127.0.0.1:1883"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/kiosk-certs/ca.crt"
    certfile = "/opt/emqx/etc/kiosk-certs/broker.crt"
    keyfile = "/opt/emqx/etc/kiosk-certs/broker.key"
    # The kiosk proves itself with a password, not a client certificate, so
    # asking for one here would refuse every device (KEHOACH 7.4).
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

# Until api exists the credentials live here; E13-T4 swaps this one block for
# an http backend and changes nothing on the device (KEHOACH 7.4).
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      path = "/opt/emqx/etc/kiosk-acl.conf"
    }
  ]
}
