%% Topic permissions for the kiosk fleet (KEHOACH 7.4).
%% Two roles: a device owns its own subtree, a service speaks to the whole
%% fleet. EMQX reads top down and stops at the first rule that matches.

%% An up topic is the device's own testimony and ends up in the attendance
%% table, so nothing server side may forge one.
{deny, {username, {re, "^svc-"}}, publish, ["kiosk/+/up/#"]}.

{allow, {username, {re, "^svc-"}}, subscribe, ["kiosk/+/up/#"]}.
{allow, {username, {re, "^svc-"}}, publish, ["kiosk/+/down/#"]}.

%% The username a kiosk connects with is its deviceId, so ${username} confines
%% each device to its own subtree: it speaks on up/ and listens on down/.
%% Publishing on its own down/ would let a stolen ticket leave a retained offer
%% there for the real kiosk to take at its next subscribe.
{allow, all, publish, ["kiosk/${username}/up/#"]}.
{allow, all, subscribe, ["kiosk/${username}/down/#"]}.

%% A client that subscribed to # or +/# would read every device at once, which
%% is the one wildcard the rule above cannot rule out on its own.
{deny, all, subscribe, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

{deny, all}.
