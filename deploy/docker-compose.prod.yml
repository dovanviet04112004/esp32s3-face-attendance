# The VPS stack (KEHOACH 4.8). Layered over docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  traefik:
    image: traefik:v3
    container_name: kiosk-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    depends_on:
      api:
        condition: service_started

  api:
    # CD pins API_TAG in .env; a developer box builds from ../backend instead.
    image: ghcr.io/dovanviet04112004/cckiosk-api:${API_TAG:-latest}
    build:
      context: ../backend
    container_name: kiosk-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_DEVICE_SECRET: ${JWT_DEVICE_SECRET}
      DEVICE_BOOTSTRAP_TOKEN: ${DEVICE_BOOTSTRAP_TOKEN}
      TEMPLATE_ENCRYPTION_KEY: ${TEMPLATE_ENCRYPTION_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      MQTT_URL: mqtts://emqx:8883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${EMQX_OPS_PASSWORD}
      MQTT_CA_CERT_PATH: /certs/ca.crt
      # The dashboard login, for closing a revoked kiosk's session (KEHOACH 7.4).
      EMQX_API_URL: http://emqx:18083/api/v5
      EMQX_API_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # Traefik alone is one hop; Cloudflare in front of it makes two (KEHOACH 4.8).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-26}
      RELEASE_DIR: /releases
      API_PUBLIC_URL: https://${API_DOMAIN}
      RELEASE_PUBLISH_TOKEN: ${RELEASE_PUBLISH_TOKEN:-}
    volumes:
      - ./emqx/certs/ca.crt:/certs/ca.crt:ro
      - releases:/releases
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      # /mqtt/auth answers the broker only, over the compose network (KEHOACH 7.4).
      traefik.http.routers.api.rule: Host(`${API_DOMAIN}`) && !PathRegexp(`(?i)^/mqtt`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls.certresolver: letsencrypt
      # rate-cloudflare once DNS goes through Cloudflare, or every user shares its addresses (KEHOACH 7.2).
      traefik.http.routers.api.middlewares: security-headers@file,${API_RATE_MIDDLEWARE:-rate-direct}@file
      traefik.http.services.api.loadbalancer.server.port: "3000"

  postgres:
    # archive_command runs in here and pushes through age (KEHOACH 4.8).
    image: kiosk-backup:local
    build: ./backup
    # The published port of the base file is dropped: on a public machine the
    # database answers only on the compose network.
    ports: !override []
    # archive_command runs as postgres and the backups volume mounts owned by root (KEHOACH 4.8).
    entrypoint: ["/usr/local/bin/pg-start.sh"]
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/archive.conf:/etc/postgresql/archive.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      BACKUP_DIR: /backups
      AGE_RECIPIENT: ${AGE_RECIPIENT}

  backup:
    image: kiosk-backup:local
    build: ./backup
    # restore-drill.sh reaches the dumps over ssh by this name.
    container_name: kiosk-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BIOMETRIC_KEEP_DAYS: ${BIOMETRIC_KEEP_DAYS:-7}
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      TZ: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
      # offsite.sh speaks to the bucket as the rclone remote "offsite" (KEHOACH 4.8 rule 3).
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_REGION:-auto}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_SECRET_ACCESS_KEY:-}
      # A token scoped to objects may not ask whether the bucket exists.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
    volumes:
      - backups:/backups

  redis:
    ports: !override []

  minio:
    # The console is an operator tool, reached over ssh rather than the web.
    ports: !override []

  emqx:
    # Traefik owns 8883 on the host and forwards it whole, so the broker keeps
    # the certificate a flashed kiosk already trusts.
    ports: !override []
    environment:
      EMQX_AUTHENTICATION__2__URL: http://api:3000/mqtt/auth

volumes:
  letsencrypt:
  # A separate volume on purpose: a backup on the database's own disk dies
  # with it, and on a real host this is a mount from somewhere else.
  backups:
  # Published firmware and model images, served to kiosks through signed links (KEHOACH 7.7).
  releases:
