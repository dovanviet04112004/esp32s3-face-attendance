# Traefik static configuration (KEHOACH 4.8).
# Everything that can change without a restart lives in dynamic.yml instead.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  # Forwarded whole, never terminated here: a kiosk checks the broker against
  # a CA burned into its firmware, which traefik's own cert would fail (7.4).
  mqtts:
    address: ":8883"

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: false

log:
  level: INFO
