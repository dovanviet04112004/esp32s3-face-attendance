# Traefik static configuration (KEHOACH 4.8).
# Everything that can change without a restart lives in dynamic.yml instead.

entryPoints:
  web:
    address: ":80"
    # X-Forwarded-For is kept only from Cloudflare (www.cloudflare.com/ips, 24/09/2026);
    # from anyone else traefik drops it, so a caller cannot claim an address (KEHOACH 7.2).
    forwardedHeaders: &cloudflare
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders: *cloudflare
  # Forwarded whole, never terminated here: a kiosk checks the broker against
  # a CA burned into its firmware, which traefik's own cert would fail (7.4).
  mqtts:
    address: ":8883"

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: false

log:
  level: INFO
