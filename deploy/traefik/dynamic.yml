# Traefik dynamic configuration (KEHOACH 4.8).

tcp:
  routers:
    mqtts:
      entryPoints:
        - mqtts
      rule: "HostSNI(`*`)"
      service: emqx
      # No tls block on purpose: passthrough. Terminating here would hand the
      # kiosk a certificate its pinned CA never signed.
  services:
    emqx:
      loadBalancer:
        servers:
          - address: "emqx:8883"

http:
  middlewares:
    # 50 a second per address with bursts to 100: a whole office behind one NAT shares it (KEHOACH 7.2).
    rate-direct:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
    # Behind Cloudflare every socket is Cloudflare's; the client is in its header.
    rate-cloudflare:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
        sourceCriterion:
          requestHeaderName: CF-Connecting-IP
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
