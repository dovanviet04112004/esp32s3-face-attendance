services:
  emqx:
    image: emqx/emqx:5
    container_name: kiosk-emqx
    restart: unless-stopped
    ports:
      # 1883 carries no TLS and serves net_mqtt until E13-T4 issues the certs.
      # Production publishes 8883 alone (KEHOACH 7.2).
      - "1883:1883"
      - "8883:8883"
      # The dashboard never leaves the host: bound to loopback on purpose.
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emqx-data:
  emqx-log:
