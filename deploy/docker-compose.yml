name: kiosk

services:
  emqx:
    image: emqx/emqx:6.3.1
    container_name: kiosk-emqx
    restart: unless-stopped
    ports:
      # Only MQTTS reaches the network; emqx.conf keeps 1883 on the container's
      # own loopback for emqx ctl (KEHOACH 7.4).
      - "8883:8883"
      # The dashboard never leaves the host: bound to loopback on purpose.
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # EMQX keeps retained messages in RAM by default, which loses the LWT
      # offline of a kiosk that is powered off across a broker restart.
      EMQX_RETAINER__BACKEND__STORAGE_TYPE: disc
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/kiosk-acl.conf:ro
      # A separate path leaves the image's own demo certs where EMQX expects them.
      - ./emqx/certs:/opt/emqx/etc/kiosk-certs:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    container_name: kiosk-postgres
    restart: unless-stopped
    ports:
      # Loopback only: the api uses the compose network in production, so this
      # mapping serves a developer running nest outside docker.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: kiosk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # A lost queue job is lost work, while the cache half rebuilds itself
    # from Postgres, so the stricter of the two roles sets the policy.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emqx-data:
  emqx-log:
  pgdata:
  redisdata:
