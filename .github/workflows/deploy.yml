name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# A newer push waits its turn rather than killing a deploy halfway (KEHOACH 4.8).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dovanviet04112004/cckiosk-api

jobs:
  test:
    uses: ./.github/workflows/backend.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ship:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Run deploy.sh on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The key only runs deploy.sh, and the host key is pinned, never scanned.
        # A quiet pull is an idle flow, and the runner's NAT cuts one at ~4 min.
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$PULL_TOKEN" | ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            "deploy@$VPS_HOST" "${{ github.sha }} ${{ github.actor }}"
