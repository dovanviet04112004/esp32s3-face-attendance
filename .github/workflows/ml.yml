name: ml

on:
  # Branches only: a release tag (KEHOACH 7.7) names a commit this already checked.
  push:
    branches: ["**"]
    paths: ["ml/**", "contracts/**", ".github/workflows/ml.yml"]
  pull_request:
    paths: ["ml/**", "contracts/**", ".github/workflows/ml.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ml

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen --extra cpu

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
